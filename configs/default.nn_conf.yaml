# Default Neural Network Accelerator Configuration
# This file is used when no explicit config is specified

precision:
  int_bits: 16
  frac_bits: 16

sigmoid:
  lut_bits: 8     # 256 entries (2^8)
  range_bits: 3   # [-8, 8)

network:
  name: default_network
  layers:
    - type: dense
      neurons: 4
      activation: sigmoid
    - type: dense
      neurons: 2
      activation: sigmoid
